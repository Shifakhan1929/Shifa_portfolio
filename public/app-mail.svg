      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="mailGrad" x1="6" y1="10" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
